<form class="card wide" [formGroup]="form" (ngSubmit)="submit()">
  <h1>{{ isEdit ? '編輯文章' : '新增文章' }}</h1>
  @if (loading()) {
    <p class="loading-text">載入文章中…</p>
  }

  <label>
    標題
    <input class="title-input" formControlName="title" placeholder="文章標題" />
  </label>
  @if (form.controls.title.touched && form.controls.title.invalid) {
    <small class="error">請輸入標題</small>
  }

  <label>
    內容
    <textarea rows="14" formControlName="content" placeholder="開始寫作…"></textarea>
  </label>
  @if (form.controls.content.touched && form.controls.content.invalid) {
    <small class="error">請輸入內容</small>
  }

  <label>
    標籤（以逗號分隔）
    <input formControlName="tags" placeholder="例如：Java, Angular" />
  </label>

  <fieldset>
    <legend>發佈狀態</legend>
    <div class="segmented">
      <label><input type="radio" formControlName="status" value="DRAFT" /><span>草稿</span></label>
      <label><input type="radio" formControlName="status" value="PUBLISHED" /><span>發佈</span></label>
    </div>
  </fieldset>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <div class="form-actions">
    <a class="btn btn-ghost" routerLink="/posts">取消</a>
    <button type="submit" [disabled]="loading() || saving()">{{ saving() ? '儲存中…' : '儲存' }}</button>
  </div>
</form>
