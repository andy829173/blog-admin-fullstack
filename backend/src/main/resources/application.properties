spring.application.name=blog-admin

spring.datasource.url=jdbc:postgresql://localhost:5432/blog_admin
spring.datasource.username=blog
spring.datasource.password=blog
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT：正式環境請用環境變數 JWT_SECRET 覆蓋（HS256 至少 32 bytes）
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl=PT2H
